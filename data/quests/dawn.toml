[text]
hook = "A new lane runs up to Aamunkoi. Someone at Aamunkoi Light is waiting for you."
coop = "You came up! Look at it. No ecliptic, no Gate, no Crown. Just the whole belt underneath us like a river of gravel. My crew's already found ice up here, and nobody's beacon on it. ... Here. The co-op voted you a share in the lane. It isn't much yet. It will be."
crown = "Saga Virta, lane master for the Crown. Mr. Korpi sends his regards and this bonus, for a delivery handled with discretion. The lane is turning a profit already. Fly it any time. Toll's paid on the way out."
lantern = "I came up the first day. I couldn't not. Listen. ... It's telling the freighters the way, one by one, like a lighthouse keeper. It asked after you. It asked me to give you this: it found it in the ice on the way up. I think it's a thank you."
gift = "a share in the Lantern's lane"
done = "The story of the Lantern is told. The Reach goes on."

[package]
name = "saalis"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Saalis: flight, combat and trade in the Northern Reach of the asteroid belt (Asciiverse)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
gilrs = { version = "0.11", default-features = false, features = ["xinput"], optional = true }
rodio = { version = "0.22", default-features = false, features = ["playback"], optional = true }

[features]
# gamepads are first-class in Asciiverse, and the sound is synthesised in the
# game; build without either with --no-default-features
default = ["gamepad", "sound"]
gamepad = ["dep:gilrs"]
sound = ["dep:rodio"]

[profile.release]
debug = 1
lto = true
